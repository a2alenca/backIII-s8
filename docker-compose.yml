services:
  # Broker de Kafka
  broker:
    image: apache/kafka:3.9.0
    hostname: broker
    container_name: backendiii-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banco-net

  # Base de datos PostgreSQL para el Banco XYZ con Healthcheck
  postgres-banco:
    image: postgres:15-alpine
    container_name: postgres-banco-xyz
    environment:
      POSTGRES_DB: banco_xyz
      POSTGRES_USER: banco_user
      POSTGRES_PASSWORD: banco_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_user -d banco_xyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - banco-net

  # Servidor de autenticación OAuth2
  auth-server:
    build: ./auth-server
    container_name: backendiii-auth
    ports:
      - "9000:9000"
    networks:
      - banco-net

  # Núcleo del Banco (Core Bank - Espera a que Postgres esté 100% operativo)
  core-bank:
    build: ./core-bank
    container_name: backendiii-core-bank
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-banco:5432/banco_xyz
      SPRING_DATASOURCE_USERNAME: banco_user
      SPRING_DATASOURCE_PASSWORD: banco_pass
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
    depends_on:
      postgres-banco:
        condition: service_healthy
      broker:
        condition: service_started
    networks:
      - banco-net

  # BFF Web del Banco XYZ
  bff-web:
    build: ./bff-web
    container_name: backendiii-bff-web
    ports:
      - "8081:8081"
    environment:
      JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      CORE_STREAMING_BASE_URL: http://backendiii-core-bank:8080
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
    depends_on:
      - auth-server
      - core-bank
      - broker
    networks:
      - banco-net

  # BFF Móvil del Banco XYZ
  bff-mobile:
    build: ./bff-mobile
    container_name: backendiii-bff-mobile
    ports:
      - "8082:8082"
    environment:
      JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      CORE_STREAMING_BASE_URL: http://backendiii-core-bank:8080
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
    depends_on:
      - auth-server
      - core-bank
      - broker
    networks:
      - banco-net

  # BFF Kiosk del Banco XYZ
  bff-kiosk:
    build: ./bff-kiosk
    container_name: backendiii-bff-kiosk
    ports:
      - "8083:8083"
    environment:
      JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      CORE_STREAMING_BASE_URL: http://backendiii-core-bank:8080
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
    depends_on:
      - auth-server
      - core-bank
      - broker
    networks:
      - banco-net

volumes:
  pgdata_banco:

networks:
  banco-net:
    driver: bridge