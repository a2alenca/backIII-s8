server.port=8082
core.bank.url=${CORE_BANK_URL:http://core-bank:8080}

server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-local

security.users.web.password=${WEB_PASSWORD:web123}
security.users.mobile.password=${MOBILE_PASSWORD:mobile123}
security.users.kiosk.password=${KIOSK_PASSWORD:kiosk123}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth-server:9000
# Resilience4j
resilience4j.circuitbreaker.instances.coreBank.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.coreBank.sliding-window-size=5
resilience4j.circuitbreaker.instances.coreBank.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.coreBank.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.coreBank.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.coreBank.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.coreBank.automatic-transition-from-open-to-half-open-enabled=true
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always