spring.application.name=banco-xyz-batch

spring.datasource.url=jdbc:postgresql://postgres-banco:5432/banco_xyz
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=banco_user
spring.datasource.password=banco_pass

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.sql.init.mode=always

logging.level.org.springframework.batch=INFO
logging.level.cl.banco.xyz.batch=INFO

app.grid-size=3
app.pool-size=4
app.chunk-size=5
app.transacciones-total=100
app.intereses-total=100
app.estados-total=100

server.port=8080
# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:broker:19092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
